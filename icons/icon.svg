<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Election Judge Field Guide (unofficial)">
  <!-- Generic ballot box + check. Fill #0B5F66 is the default accent; swap per county. Full-bleed square for maskable icons (safe zone = center 80%). -->
  <rect width="512" height="512" fill="#0B5F66"/>
  <!-- ballot card entering slot -->
  <rect x="196" y="96" width="120" height="150" rx="10" fill="#FFFFFF"/>
  <path d="M222 168 l22 24 l46 -52" fill="none" stroke="#0B5F66" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- box -->
  <rect x="120" y="226" width="272" height="190" rx="18" fill="#FFFFFF"/>
  <rect x="176" y="226" width="160" height="22" rx="6" fill="#0B5F66"/>
  <rect x="160" y="300" width="192" height="12" rx="6" fill="#D5DAE1"/>
</svg>
